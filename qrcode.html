<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>貳參小館｜QR Code 桌貼一鍵列印器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入輕量級 QR Code 產生套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    /* 列印專用樣式：隱藏操作列，確保卡片不會被從中間切斷 */
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-grid { gap: 12px !important; }
      .sticker-card {
        break-inside: avoid;
        page-break-inside: avoid;
        border: 2px dashed #94a3b8 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-4 sm:p-8">

  <!-- 頂部操作列（列印時自動隱藏） -->
  <div class="no-print max-w-4xl mx-auto bg-slate-900 text-white rounded-2xl p-5 mb-6 flex flex-wrap items-center justify-between gap-4 shadow-lg">
    <div>
      <div class="flex items-center gap-2">
        <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2 py-0.5 rounded">貳參小館</span>
        <h1 class="text-lg font-bold">QR Code 桌貼一鍵列印器（共 11 張）</h1>
      </div>
      <p class="text-xs text-slate-400 mt-1">已自動對應第 1～10 桌與外帶網址，建議使用 A4 紙張列印後沿虛線剪下護貝。</p>
    </div>
    <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-sm transition cursor-pointer">
      🖨️ 立即列印 / 存成 PDF
    </button>
  </div>

  <!-- A4 桌貼網格區 -->
  <div id="stickers-container" class="print-grid max-w-4xl mx-auto grid grid-cols-2 sm:grid-cols-3 gap-4">
    <!-- JS 動態生成 11 張 QR Code 桌貼 -->
  </div>

  <script>
    const BASE_URL = "https://crazymankey.github.io/RICE/";

    const TARGETS = [
      { param: "1", title: "第 1 桌", badge: "內用掃碼點餐" },
      { param: "2", title: "第 2 桌", badge: "內用掃碼點餐" },
      { param: "3", title: "第 3 桌", badge: "內用掃碼點餐" },
      { param: "4", title: "第 4 桌", badge: "內用掃碼點餐" },
      { param: "5", title: "第 5 桌", badge: "內用掃碼點餐" },
      { param: "6", title: "第 6 桌", badge: "內用掃碼點餐" },
      { param: "7", title: "第 7 桌", badge: "內用掃碼點餐" },
      { param: "8", title: "第 8 桌", badge: "內用掃碼點餐" },
      { param: "9", title: "第 9 桌", badge: "內用掃碼點餐" },
      { param: "10", title: "第 10 桌", badge: "內用掃碼點餐" },
      { param: "takeout", title: "外帶", badge: "外帶掃碼點餐" }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("stickers-container");

      TARGETS.forEach((item, index) => {
        const fullUrl = `${BASE_URL}?table=${item.param}`;
        const qrId = `qr-box-${index}`;

        const card = document.createElement("div");
        card.className = "sticker-card bg-white border-2 border-dashed border-slate-300 rounded-2xl p-4 flex flex-col items-center text-center shadow-sm";
        card.innerHTML = `
          <div class="text-xs font-extrabold tracking-widest text-amber-600 mb-0.5">貳參小館</div>
          <div class="text-2xl font-black text-slate-900 tracking-tight mb-1">${item.title}</div>
          <span class="inline-block bg-slate-900 text-amber-400 text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-3">${item.badge}</span>
          
          <div id="${qrId}" class="p-2 bg-white border border-slate-200 rounded-xl mb-3 flex items-center justify-center"></div>
          
          <div class="text-xs font-bold text-slate-800 leading-snug">📱 手機掃碼直接點餐</div>
          <div class="text-[11px] font-semibold text-rose-600 mt-0.5">送單後請先至櫃檯現金結帳</div>
          <div class="text-[9px] text-slate-400 mt-1.5 break-all">${fullUrl}</div>
        `;
        container.appendChild(card);

        new QRCode(document.getElementById(qrId), {
          text: fullUrl,
          width: 140,
          height: 140,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    });
  </script>
</body>
</html>
