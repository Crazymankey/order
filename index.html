<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>貳參小館｜手機掃碼點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen pb-28">

  <!-- 頂部店名與用餐方式狀態列 -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-amber-500 text-slate-950 text-xs font-extrabold px-2 py-0.5 rounded">貳參小館</span>
          <h1 class="text-base sm:text-lg font-bold tracking-wide">線上點餐</h1>
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5">嘉義市軍輝路 23 號・送單後請至櫃檯現金結帳</p>
      </div>

      <button
        type="button"
        onclick="openModeModal()"
        class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-amber-300 text-xs font-bold px-3 py-2 rounded-xl transition shrink-0 cursor-pointer"
      >
        <span id="current-mode-badge">尚未選擇</span> ✎
      </button>
    </div>
  </header>

  <!-- 強制內用 / 外帶選擇 Modal（每次進入或尚未選定時顯示，避免輸入錯誤） -->
  <div id="mode-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white text-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="text-xs font-extrabold tracking-wider text-amber-600 uppercase">貳參小館・點餐前確認</div>
      <h2 class="text-xl font-black mt-1">請選擇用餐方式</h2>
      <p class="text-xs text-slate-500 mt-1">為避免桌號或外帶填寫錯誤，請先確認您的用餐方式與桌號。</p>

      <div class="grid grid-cols-2 gap-3 mt-5">
        <button
          type="button"
          id="btn-select-dinein"
          onclick="chooseMode('dinein')"
          class="p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-500 bg-slate-50 text-left transition cursor-pointer"
        >
          <div class="text-2xl mb-1">🍽️</div>
          <div class="font-black text-base">內用</div>
          <div class="text-[11px] text-slate-500 mt-0.5">選擇第 1～10 桌</div>
        </button>

        <button
          type="button"
          id="btn-select-takeout"
          onclick="chooseMode('takeout')"
          class="p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-500 bg-slate-50 text-left transition cursor-pointer"
        >
          <div class="text-2xl mb-1">🛍️</div>
          <div class="font-black text-base">外帶</div>
          <div class="text-[11px] text-slate-500 mt-0.5">櫃檯取餐現金付款</div>
        </button>
      </div>

      <!-- 內用桌號選擇區 -->
      <div id="table-picker-box" class="hidden mt-5 pt-4 border-t border-slate-200">
        <div class="text-xs font-bold text-slate-700 mb-2.5">請點選您的桌號（第 1～10 桌）：</div>
        <div id="table-buttons-grid" class="grid grid-cols-5 gap-2"></div>
      </div>

      <button
        type="button"
        id="confirm-mode-btn"
        onclick="confirmModeSelection()"
        disabled
        class="mt-6 w-full py-3.5 rounded-2xl font-extrabold text-sm bg-slate-200 text-slate-400 transition disabled:cursor-not-allowed cursor-pointer"
      >
        確認並開始點餐
      </button>
    </div>
  </div>

  <!-- 主菜單內容區 -->
  <main class="max-w-2xl mx-auto px-4 pt-5 space-y-6">
    <!-- 提醒橫幅 -->
    <div class="bg-amber-50 border border-amber-200 text-amber-950 rounded-2xl p-3.5 text-xs leading-relaxed flex items-start gap-2.5">
      <span class="text-base shrink-0">💡</span>
      <div>
        送出訂單後系統會即時通知櫃檯，請持手機畫面或報桌號／外帶至櫃檯完成現金結帳，櫃檯確認後將為您安排出餐。
      </div>
    </div>

    <!-- 餐點清單容器 -->
    <section id="menu-container" class="space-y-4"></section>

    <!-- 備註欄位 -->
    <section class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200">
      <label for="order-note" class="block text-sm font-bold text-slate-800 mb-2">
        📝 餐點備註（選填）
      </label>
      <input
        id="order-note"
        type="text"
        maxlength="100"
        placeholder="例如：不要香菜、少辣、湯麵分開等"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
      />
    </section>
  </main>

  <!-- 底部購物車送出列 -->
  <footer class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-xs border-t border-slate-200 shadow-lg">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div>
        <div class="text-xs text-slate-500">已選 <span id="cart-count" class="font-bold text-slate-900">0</span> 份餐點</div>
        <div class="text-lg font-black text-slate-900">合計 $<span id="cart-total">0</span></div>
      </div>

      <button
        type="button"
        id="submit-order-btn"
        onclick="submitOrder()"
        disabled
        class="bg-amber-500 hover:bg-amber-400 disabled:bg-slate-200 disabled:text-slate-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-sm transition disabled:cursor-not-allowed cursor-pointer"
      >
        送出訂單
      </button>
    </div>
  </footer>

  <!-- 送單完成憑證 Modal -->
  <div id="receipt-modal" class="hidden fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 text-2xl mb-2">✓</div>
        <h3 class="text-xl font-black text-slate-900">訂單已送出</h3>
        <p class="text-xs text-slate-500 mt-1">請至櫃檯現金結帳，櫃檯將為您處理出餐</p>
      </div>

      <div id="receipt-detail" class="mt-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs space-y-2"></div>

      <div class="mt-5 flex gap-2.5">
        <button
          type="button"
          onclick="closeReceiptModal(false)"
          class="flex-1 py-3 rounded-2xl border border-slate-300 font-bold text-xs text-slate-700 hover:bg-slate-100 cursor-pointer"
        >
          繼續加點
        </button>
        <button
          type="button"
          onclick="closeReceiptModal(true)"
          class="flex-1 py-3 rounded-2xl bg-slate-900 text-white font-bold text-xs hover:bg-slate-800 cursor-pointer"
        >
          完成並清空
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 請將下方 N8N_WEBHOOK_URL 替換為你的 n8n Webhook 網址（推播至 Telegram）
    // =========================================================================
    const N8N_WEBHOOK_URL = "https://你的-n8n-網域/webhook/rice-order";

    // 貳參小館菜單資料（可依實際品項與價格自行調整）
    const MENU_ITEMS = [
      { id: "m1", category: "主食類", name: "招牌滷肉飯", price: 45, desc: "肥瘦適中慢火滷製，鹹香下飯" },
      { id: "m2", category: "主食類", name: "雞肉飯", price: 50, desc: "手撕鮮嫩雞肉搭配油蔥酥與醬汁" },
      { id: "m3", category: "湯品類", name: "貢丸湯", price: 35, desc: "Q彈貢丸搭配清甜高湯與芹菜珠" },
      { id: "m4", category: "小菜類", name: "燙青菜", price: 40, desc: "當日新鮮時蔬川燙淋特製醬汁" },
      { id: "m5", category: "小菜類", name: "滷蛋＋油豆腐", price: 30, desc: "入味滷蛋一顆搭配吸汁油豆腐" }
    ];

    const state = {
      mode: null, // 'dinein' | 'takeout'
      tableNumber: null, // 1 ~ 10
      draftMode: null,
      draftTable: null,
      cart: {} // { [itemId]: quantity }
    };

    function initFromUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const tableParam = (params.get("table") || "").trim().toLowerCase();

      if (tableParam === "takeout") {
        state.mode = "takeout";
        state.tableNumber = null;
        updateModeUI();
        closeModeModal();
        return;
      }

      const num = Number(tableParam);
      if (Number.isInteger(num) && num >= 1 && num <= 10) {
        state.mode = "dinein";
        state.tableNumber = num;
        updateModeUI();
        closeModeModal();
        return;
      }

      // 未帶入有效參數時保持強制選擇視窗開啟
      openModeModal();
    }

    function openModeModal() {
      state.draftMode = state.mode;
      state.draftTable = state.tableNumber;
      renderDraftModeUI();
      document.getElementById("mode-modal").classList.remove("hidden");
    }

    function closeModeModal() {
      document.getElementById("mode-modal").classList.add("hidden");
    }

    function chooseMode(mode) {
      state.draftMode = mode;
      if (mode === "takeout") {
        state.draftTable = null;
      }
      renderDraftModeUI();
    }

    function selectDraftTable(num) {
      state.draftMode = "dinein";
      state.draftTable = num;
      renderDraftModeUI();
    }

    function renderDraftModeUI() {
      const dineinBtn = document.getElementById("btn-select-dinein");
      const takeoutBtn = document.getElementById("btn-select-takeout");
      const pickerBox = document.getElementById("table-picker-box");
      const grid = document.getElementById("table-buttons-grid");
      const confirmBtn = document.getElementById("confirm-mode-btn");

      dineinBtn.className = `p-4 rounded-2xl border-2 text-left transition cursor-pointer ${
        state.draftMode === "dinein"
          ? "border-amber-500 bg-amber-50"
          : "border-slate-200 hover:border-amber-400 bg-slate-50"
      }`;

      takeoutBtn.className = `p-4 rounded-2xl border-2 text-left transition cursor-pointer ${ state.draftMode === "takeout" ? "border-amber-500 bg-amber-50" : "border-slate-200 hover:border-amber-400 bg-slate-50" }`;  if (state.draftMode === "dinein") { pickerBox.classList.remove("hidden"); grid.innerHTML = ""; for (let i = 1; i <= 10; i++) { const active = state.draftTable === i; const btn = document.createElement("button"); btn.type = "button"; btn.textContent = `${i} 桌`;
          btn.onclick = () => selectDraftTable(i);
          btn.className = `py-2 rounded-xl text-xs font-extrabold border transition cursor-pointer ${ active ? "bg-slate-900 text-amber-400 border-slate-900" : "bg-white text-slate-700 border-slate-300 hover:border-amber-500" }`; grid.appendChild(btn); } } else { pickerBox.classList.add("hidden"); }  const isValid = state.draftMode === "takeout" \vert{}\vert{} (state.draftMode === "dinein" && Number.isInteger(state.draftTable) && state.draftTable >= 1 && state.draftTable <= 10);  confirmBtn.disabled = !isValid; confirmBtn.className = isValid ? "mt-6 w-full py-3.5 rounded-2xl font-extrabold text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 transition cursor-pointer" : "mt-6 w-full py-3.5 rounded-2xl font-extrabold text-sm bg-slate-200 text-slate-400 transition disabled:cursor-not-allowed cursor-pointer"; }  function confirmModeSelection() { if (!state.draftMode) return; state.mode = state.draftMode; state.tableNumber = state.draftMode === "dinein" ? state.draftTable : null; updateModeUI(); closeModeModal(); }  function getDiningLabel() { if (state.mode === "takeout") return "外帶"; if (state.mode === "dinein" && state.tableNumber) return `第 ${state.tableNumber} 桌`;
      return "尚未選擇";
    }

    function updateModeUI() {
      document.getElementById("current-mode-badge").textContent = getDiningLabel();
    }

    function renderMenu() {
      const container = document.getElementById("menu-container");
      container.innerHTML = "";

      MENU_ITEMS.forEach((item) => {
        const qty = state.cart[item.id] || 0;
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-4 shadow-xs border border-slate-200 flex items-center justify-between gap-3";
        card.innerHTML = `
          <div class="min-w-0">
            <div class="text-[11px] font-bold text-amber-600">${item.category}</div>
            <div class="text-base font-extrabold text-slate-900 truncate">${item.name}</div>
            <p class="text-xs text-slate-500 mt-0.5 line-clamp-2">${item.desc}</p> <div class="text-sm font-black text-slate-900 mt-1.5">$${item.price}</div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            ${
              qty > 0
                ? `
                  <button type="button" onclick="changeQty('${item.id}', -1)" class="w-8 h-8 rounded-full border border-slate-300 font-bold text-slate-700 hover:bg-slate-100 cursor-pointer">-</button>
                  <span class="w-5 text-center font-black text-sm">${qty}</span>
                `
                : ""
            }
            <button type="button" onclick="changeQty('${item.id}', 1)" class="w-8 h-8 rounded-full bg-slate-900 text-amber-400 font-black hover:bg-slate-800 cursor-pointer">+</button>
          </div>
        `;
        container.appendChild(card);
      });

      updateCartSummary();
    }

    function changeQty(itemId, delta) {
      const nextQty = (state.cart[itemId] || 0) + delta;
      if (nextQty <= 0) {
        delete state.cart[itemId];
      } else {
        state.cart[itemId] = nextQty;
      }
      renderMenu();
    }

    function updateCartSummary() {
      let totalCount = 0;
      let totalAmount = 0;

      MENU_ITEMS.forEach((item) => {
        const qty = state.cart[item.id] || 0;
        totalCount += qty;
        totalAmount += qty * item.price;
      });

      document.getElementById("cart-count").textContent = totalCount;
      document.getElementById("cart-total").textContent = totalAmount;

      const submitBtn = document.getElementById("submit-order-btn");
      submitBtn.disabled = totalCount === 0;
    }

    async function submitOrder() {
      if (!state.mode || (state.mode === "dinein" && !state.tableNumber)) {
        openModeModal();
        return;
      }

      const items = MENU_ITEMS
        .filter((item) => (state.cart[item.id] || 0) > 0)
        .map((item) => ({
          id: item.id,
          name: item.name,
          price: item.price,
          qty: state.cart[item.id],
          subtotal: item.price * state.cart[item.id]
        }));

      if (items.length === 0) return;

      const totalAmount = items.reduce((sum, i) => sum + i.subtotal, 0);
      const note = document.getElementById("order-note").value.trim();
      const diningLabel = getDiningLabel();
      const orderTime = new Date().toLocaleTimeString("zh-TW", { hour12: false });

      const payload = {
        store: "貳參小館",
        diningMode: state.mode === "takeout" ? "外帶" : "內用",
        diningLabel,
        tableNumber: state.tableNumber,
        items,
        totalAmount,
        note,
        orderTime
      };

      const submitBtn = document.getElementById("submit-order-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      try {
        if (N8N_WEBHOOK_URL && !N8N_WEBHOOK_URL.includes("你的-n8n-網域")) {
          await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }
      } catch (err) {
        console.error("Webhook 送出失敗：", err);
      } finally {
        submitBtn.textContent = "送出訂單";
        updateCartSummary();
      }

      showReceiptModal(payload);
    }

    function showReceiptModal(order) {
      const detail = document.getElementById("receipt-detail");
      const itemsHtml = order.items
        .map((i) => `<div class="flex justify-between"><span>${i.name} ×${i.qty}</span><span class="font-bold
